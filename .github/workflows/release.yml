name: 安装包与 Linux standalone
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['acprof/**', 'dockerfiles/**', 'assets/**', 'pyproject.toml', 'hatch_build.py', 'packaging/**', 'scripts/check_distribution.py', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.13'
          python-version: '3.10'
      - run: uv build
      - name: 安装 wheel 并从空目录验证
        run: |
          uv venv .release-venv --python 3.10
          uv pip install --python .release-venv/bin/python -r requirements.lock
          uv pip install --python .release-venv/bin/python --no-deps dist/*.whl
          .release-venv/bin/python scripts/check_distribution.py --report evidence/wheel.json
          uv tool install --python 3.10 --constraint requirements.lock --from dist/*.whl acprof
          uv tool run acprof --version
      - name: 构建并验证 standalone
        run: |
          uv pip install --python .release-venv/bin/python 'pyinstaller==6.22.3'
          .release-venv/bin/python -m PyInstaller --noconfirm --clean packaging/acprof.spec
          .release-venv/bin/python scripts/check_distribution.py --binary dist/acprof --report evidence/standalone.json
          mv dist/acprof dist/acprof-linux-x86_64
          cd dist
          sha256sum acprof-linux-x86_64 *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-evidence
          path: evidence/

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist/
      - name: 核对 tag 版本并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os; from acprof import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__, "tag and package version differ"'
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
