name: 离线回归与容器兼容
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python scripts/run_tests.py --report evidence/host.json
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
      - run: |
          python run.py --help
          python probe.py --help
          python profile.py --help
          python plot.py --help
          python audit.py --help
          python stats.py --help
          python scripts/render_metric_reference.py --check
          python -m compileall -q acprof scripts run.py probe.py profile.py plot.py audit.py stats.py tui.py
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-${{ matrix.python }}
          path: evidence/
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [nlp, cv, audio, diffusion, structured, timeseries, multimodal]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_runtime.py --family '${{ matrix.family }}' --variant cpu --output-dir evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runtime-${{ matrix.family }}
          path: evidence/
